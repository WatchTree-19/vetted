[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vetted"
version = "0.1.0"
description = "Independent validation for risk models and trading strategies: VaR and ES backtests, Basel FRTB tests, backtest overfitting, and verified metrics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sandeep Singh Rai" }]
keywords = [
  "value-at-risk", "expected-shortfall", "backtesting", "frtb", "basel",
  "model-risk", "model-validation", "sharpe-ratio", "deflated-sharpe-ratio",
  "backtest-overfitting", "conformal-prediction", "quant", "risk-management",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
conformance = ["pandas>=1.5"]
test = ["pytest>=7", "pandas>=1.5", "statsmodels>=0.13"]

[project.urls]
Homepage = "https://github.com/WatchTree-19/vetted"
Documentation = "https://watchtree-19.github.io/vetted/"
Issues = "https://github.com/WatchTree-19/vetted/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vetted"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "oracle", "examples", "docs", "mkdocs.yml", "README.md", "LICENSE", "CONFORMANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"
