name: release

# Publishing a GitHub release (for example tag v0.1.0) builds vetted, runs the
# tests on the built wheel, and uploads it to PyPI. There is no PyPI password
# or token anywhere: PyPI trusts this workflow directly ("trusted publishing"),
# configured once on pypi.org for project "vetted", owner WatchTree-19,
# repository vetted, workflow release.yml, environment pypi.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag $TAG, package $VERSION"
          test "$TAG" = "$VERSION"
      - run: python -m pip install build
      - run: python -m build
      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl pytest pandas statsmodels
          cd tests && python -m pytest -q -p no:cacheprovider --rootdir=. .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
